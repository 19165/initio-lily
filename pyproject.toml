[project]
name = "initio-lily"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.26.0",
    "ollama>=0.6.2",
    "openpyxl>=3.1.5",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "psycopg-pool>=3.1.0",
    "psycopg[binary]>=3.1.0",
    "pypdf>=6.16.2",
    "tavily-python>=0.8.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "BLE001",  # Do not catch blind exception (intentional fail-safe fallback in agent tools)
    "B008",    # Do not perform function call in argument defaults
    "E501",    # Line length check (handled by formatter)
]

[tool.ruff.lint.isort]
combine-as-imports = true

